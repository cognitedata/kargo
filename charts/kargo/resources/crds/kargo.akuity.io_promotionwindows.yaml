---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: promotionwindows.kargo.akuity.io
spec:
  group: kargo.akuity.io
  names:
    kind: PromotionWindow
    listKind: PromotionWindowList
    plural: promotionwindows
    shortNames:
    - promotionwindow
    - promotionwindows
    singular: promotionwindow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.timeZone
      name: TimeZone
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PromotionWindows defines time windows during which automatic promotions
          are allowed to occur. If not specified, automatic promotions can occur at
          any time.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Spec describes the composition of an AutoPromotionWindow, including the
              recurring time window and time zone.
            properties:
              duration:
                description: |-
                  Duration is the length of time that the window lasts after the start
                  time defined by the Schedule.
                type: string
                x-kubernetes-validations:
                - message: Duration must be positive
                  rule: 'duration(self) > duration(''0s'') '
              kind:
                description: |-
                  Kind is either "deny" or "allow", indicating whether the time window
                  represents a period during which promotions are denied or allowed.
                enum:
                - deny
                - allow
                type: string
              labelSelector:
                description: |-
                  LabelSelector to target either Projects or Stages.
                  I am using a LabelSelector instead of a typed field to isolate all the changes to limit the conflict with upstream.
                  Beware: empty labelSelector means it matches all in the namespace
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              schedule:
                description: |-
                  Schedule describes a recurring time window.
                  Example: "0 0 * * 1-5" means every weekday at midnight.
                type: string
              timeZone:
                description: |-
                  TimeZone is the IANA time zone name that applies to the time window.
                  If not specified, UTC is assumed.
                type: string
            required:
            - duration
            - schedule
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
